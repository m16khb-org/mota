name: commute-bus-web

services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - --protocol
      - http2
      - run
    volumes:
      - "${HOME}/.cloudflared/commute-bus-web.yml:/etc/cloudflared/config.yml:ro"
      - "${HOME}/.cloudflared/commute-bus-web.json:/etc/cloudflared/credentials.json:ro"
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
