name: mota

services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      cloudflare-tunnel:
        aliases:
          - mota
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  cloudflare-tunnel:
    external: true
